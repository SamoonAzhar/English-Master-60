<!DOCTYPE html>
<html lang="ur">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f172a;--card:#1e293b;--card2:#263449;--txt:#f1f5f9;--sub:#94a3b8;--grn:#22c55e;--amb:#f59e0b;--red:#ef4444;--blu:#3b82f6}
body{background:var(--bg);color:var(--txt);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:76px}
header{padding:16px;position:sticky;top:0;background:var(--bg);z-index:9;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155}
header h1{font-size:18px}
header .meta{font-size:13px;color:var(--sub)}
.pill{background:var(--card2);border-radius:20px;padding:4px 12px;font-size:13px;margin-left:6px}
main{padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin-bottom:8px}
h3{font-size:15px;margin:12px 0 6px;color:#7dd3fc}
p,li{font-size:14px;line-height:1.7;color:var(--sub)}
ul{padding-left:18px}
.ex{background:var(--card2);border-left:3px solid var(--grn);padding:10px 12px;border-radius:8px;margin:8px 0;font-size:14px;color:var(--txt)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-grn{background:var(--grn);color:#052e16}
.btn-blu{background:var(--blu);color:#fff}
.btn-gry{background:var(--card2);color:var(--txt)}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dcell{background:var(--card);border-radius:10px;padding:10px 2px;text-align:center;cursor:pointer;border:1px solid transparent}
.dcell .n{font-weight:700;font-size:15px}
.dcell .s{font-size:10px;margin-top:2px}
.done{border-color:var(--grn)} .done .n{color:var(--grn)}
.test{border-color:var(--amb)} .lock{opacity:.35;pointer-events:none}
.ringwrap{display:flex;align-items:center;gap:16px}
.big{font-size:30px;font-weight:700}
.tag{display:inline-block;background:var(--card2);border-radius:6px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0;color:var(--sub)}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid #334155;color:var(--txt);padding:13px;border-radius:10px;margin:8px 0;font-size:15px;cursor:pointer}
.opt.correct{background:#14532d;border-color:var(--grn)}
.opt.wrong{background:#450a0a;border-color:var(--red)}
.todo{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card2);border-radius:10px;margin:8px 0;font-size:14px;cursor:pointer}
.todo .cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--sub);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.todo.ok .cb{background:var(--grn);border-color:var(--grn);color:#052e16;font-weight:700}
.todo.ok{color:var(--sub);text-decoration:line-through}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;max-width:480px;margin:0 auto;border-top:1px solid #334155;z-index:9}
nav button{flex:1;background:none;border:none;color:var(--sub);padding:12px 0 10px;font-size:12px;cursor:pointer}
nav button.on{color:var(--grn)}
nav button span{display:block;font-size:20px;margin-bottom:2px}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--grn)}
.bar.b i{background:var(--blu)}
.stat{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.stat .v{font-size:20px;font-weight:700;color:var(--grn)}
.statrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
input[type=text]{width:100%;padding:13px;border-radius:10px;border:1px solid #334155;background:var(--card2);color:var(--txt);font-size:15px}
.cert{border:3px solid var(--amb);border-radius:14px;padding:24px;text-align:center;background:linear-gradient(180deg,#1e293b,#0f172a)}
.cert h2{color:var(--amb);font-size:22px}
.feedback{padding:12px;border-radius:10px;font-size:14px;margin-top:10px}
.fb-ok{background:#14532d;color:#86efac}.fb-no{background:#450a0a;color:#fca5a5}
.center{text-align:center}
.hidden{display:none}
.topictag{font-size:12px;color:var(--blu);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>

<script>
const DAYS = [{"t": "Sentence kya hai?", "topic": "Sentence", "pts": ["Sentence alfaz ka wo group hai jo mukammal khayal (complete thought) deta hai — shuru ka letter bara aur aakhir mein full stop, question mark ya exclamation mark hota hai.", "Har sentence do hisson par mushtamil hota hai: SUBJECT (kis ke baray mein) aur PREDICATE (kya kehna hai).", "Mukammal sentence mein finite verb (tayyar kiya, kha raha hai) zaroor hota hai.", "Incomplete group of words ko phrase kehte hain, sentence nahi."], "ex": ["The boy plays cricket. (Subject: The boy · Predicate: plays cricket)", "She is reading a book.", "In the garden. ❌ (ye sentence nahi, phrase hai — koi verb nahi)"], "quiz": [{"q": "In mein se kaunsa mukammal sentence hai?", "o": ["Running in the park", "She runs in the park", "In the morning", "Fast and quick"], "a": 1}, {"q": "Sentence ke kitne main hisse hote hain?", "o": ["1", "2", "3", "4"], "a": 1, "w": "Subject aur Predicate."}, {"q": "Sentence kis se shuru hona chahiye?", "o": ["Chhota letter", "Bara letter", "Number se", "Comma se"], "a": 1}, {"q": "Kaunsa sentence ghalat hai?", "o": ["The cat sleeps.", "He is a doctor.", "Under the table.", "They went home."], "a": 2, "w": "'Under the table' mein verb nahi — ye phrase hai."}, {"q": "'Birds fly in the sky.' mein subject kya hai?", "o": ["fly", "in the sky", "Birds", "the sky"], "a": 2}]}, {"t": "Parts of Speech — overview", "topic": "Parts of Speech", "pts": ["English grammar mein har lafz 8 categories (parts of speech) mein se kisi ek mein aata hai.", "8 parts: Noun (naam), Pronoun (sarifnaam), Adjective (sifat), Verb (fe'l), Adverb (qayd), Preposition (harf-e-jarr), Conjunction (harf-e-atf), Interjection (unka aizhar).", "Ek hi lafz sentence ke hisaab se alag part of speech ban sakta hai — jaise 'run' (verb) aur 'a run' (noun)."], "ex": ["Ahmad runs fast. → Ahmad = Noun, runs = Verb, fast = Adverb", "Wow! What a beautiful day. → Wow = Interjection, beautiful = Adjective", "He sat on the chair. → on = Preposition"], "quiz": [{"q": "Parts of speech ki total categories kitni hain?", "o": ["6", "7", "8", "10"], "a": 2}, {"q": "'Beautiful' kaunsa part of speech hai?", "o": ["Noun", "Adjective", "Verb", "Adverb"], "a": 1}, {"q": "'And', 'but', 'or' kis category mein aate hain?", "o": ["Preposition", "Pronoun", "Conjunction", "Interjection"], "a": 2}, {"q": "'Wow!', 'Alas!', 'Hurrah!' kya kehlata hai?", "o": ["Adjective", "Interjection", "Noun", "Adverb"], "a": 1}, {"q": "'He' lafz kis category ka hai?", "o": ["Noun", "Pronoun", "Verb", "Conjunction"], "a": 1}]}, {"t": "Noun: kinds, countable/uncountable", "topic": "Noun", "pts": ["Noun kisi bhi cheez, shakhs, jagah, ya khayal ka naam hai: Karachi, Ali, book, happiness.", "Proper Noun: khaas naam (Pakistan, Monday) — hamesha bara letter se shuru.", "Common Noun: aam naam (city, boy, book).", "Countable nouns (book, pen) ginay ja sakte hain; Uncountable (water, milk, information) nahi ginay ja sakte aur in ke sath 'a/an' nahi aata."], "ex": ["I live in Karachi. (proper)", "She bought two books. (countable)", "Give me some water. ✔ / a water ❌ (uncountable)"], "quiz": [{"q": "Kaunsa proper noun hai?", "o": ["city", "boy", "Ali", "book"], "a": 2}, {"q": "Kaunsa countable noun hai?", "o": ["water", "milk", "pen", "information"], "a": 2}, {"q": "'Happiness' kis type ka noun hai?", "o": ["Concrete noun", "Abstract noun", "Proper noun", "Countable noun"], "a": 1, "w": "Jise chhoo na sakain (khayal/jazbaat) = abstract noun."}, {"q": "'a/an' kis nouns ke sath nahi aata?", "o": ["Singular nouns", "Uncountable nouns", "Plural nouns", "Proper nouns"], "a": 1}, {"q": "'Cattle is/are grazing.' Sahi verb kya hai?", "o": ["is", "are", "was", "be"], "a": 1, "w": "'Cattle' plural verb leta hai."}]}, {"t": "Noun: Number, Gender, Case", "topic": "Noun", "pts": ["Number: Singular (ek) aur Plural (zyada). Zyada tar plural 's' ya 'es' se banta hai.", "Khaas plurals: man→men, woman→women, child→children, tooth→teeth, foot→feet, mouse→mice.", "Kuch nouns sirf plural mein aate hain: scissors, trousers, goods, cattle.", "Gender: Masculine (boy, king), Feminine (girl, queen), Common (teacher, student), Neuter (book, table).", "Case: Nominative (karta), Objective (karm), Possessive (malikana — Ali's book)."], "ex": ["one child → two children", "The scissors are on the table. (plural verb)", "This is Sara's bag. (possessive case)"], "quiz": [{"q": "'Child' ka plural kya hai?", "o": ["Childs", "Children", "Childes", "Child"], "a": 1}, {"q": "'Tooth' ka plural?", "o": ["Tooths", "Toothies", "Teeth", "Teeths"], "a": 2}, {"q": "'Scissors' ke sath kaunsa verb aayega?", "o": ["is", "are", "was", "has"], "a": 1}, {"q": "'Teacher' kis gender hai?", "o": ["Masculine", "Feminine", "Common", "Neuter"], "a": 2}, {"q": "'Ahmed's car' — yahan apostrophe-s kis case ko dikhata hai?", "o": ["Nominative", "Objective", "Possessive", "Accusative"], "a": 2}]}, {"t": "The Pronoun", "topic": "Pronoun", "pts": ["Pronoun noun ki jagah istemal hota hai taake repetition na ho: 'Ali is tall. HE is kind.'", "Personal pronouns: I, you, he, she, it, we, they — aur in ke object forms: me, him, her, us, them.", "Possessive pronouns: mine, yours, his, hers, ours, theirs (akela aata hai, noun ke baghair).", "Demonstrative: this, that, these, those (nisbat ke liye)."], "ex": ["Maria lost her book. → Her = possessive adjective", "This pen is mine. (mine = possessive pronoun)", "I saw him at the market. (him = object form)"], "quiz": [{"q": "Pronoun kis ki jagah aata hai?", "o": ["Verb ki", "Noun ki", "Adjective ki", "Adverb ki"], "a": 1}, {"q": "Kaunsa possessive pronoun hai?", "o": ["my", "mine", "me", "I"], "a": 1, "w": "'My' possessive adjective hai; 'mine' pronoun."}, {"q": "'This' aur 'these' kis qisam ke pronouns hain?", "o": ["Personal", "Demonstrative", "Relative", "Indefinite"], "a": 1}, {"q": "Object form of 'she'?", "o": ["Her", "Hers", "She", "Herself"], "a": 0}, {"q": "'They invited ___ to the party.'", "o": ["we", "us", "our", "ours"], "a": 1}]}, {"t": "Pronoun: Relative, Interrogative, Indefinite", "topic": "Pronoun", "pts": ["Relative pronouns (who, whom, whose, which, that) do clauses ko jorte hain: 'The man WHO came...'", "Interrogative pronouns (who, what, which, whom) sawalon mein istemal hote hain.", "Indefinite pronouns kisi khaas shakhs ko nahi batate: someone, anyone, everyone, nobody, each, all, some.", "'Each' singular verb leta hai; 'all' ke sath plural verb aata hai jab poora group matlab ho."], "ex": ["The girl who won the prize is my sister.", "Who is at the door?", "Each student has a book. / All students have books."], "quiz": [{"q": "'The boy ___ broke the window ran away.'", "o": ["who", "whom", "whose", "which"], "a": 0}, {"q": "'___ is your name?' mein kya aayega?", "o": ["Who", "What", "Whom", "Which"], "a": 1}, {"q": "'Each of the boys ___ a pen.", "o": ["have", "has", "are having", "having"], "a": 1}, {"q": "Kaunsa indefinite pronoun hai?", "o": ["that", "someone", "she", "this"], "a": 1}, {"q": "'This is the house ___ we built.'", "o": ["who", "which", "whom", "whose"], "a": 1}]}, {"test": true, "t": "Weekly Test 1", "topic": "Foundation"}, {"t": "The Adjective", "topic": "Adjective", "pts": ["Adjective noun ya pronoun ki sifat (quality) batata hai: a beautiful garden, tall boy.", "Adjectives of quality: good, big, red, honest. Quantity: some, much, little. Number: one, two, many, several.", "Proper adjectives proper noun se bante hain: Pakistan → Pakistani food.", "'Enough' noun ke pehle aur adjective ke baad aata hai: enough money, tall enough."], "ex": ["She is a clever girl. (quality)", "There is little water. (quantity)", "He is tall enough to reach the shelf."], "quiz": [{"q": "Adjective kya batata hai?", "o": ["Action", "Noun/pronoun ki quality", "Time", "Place"], "a": 1}, {"q": "'Many' kis qisam ka adjective hai?", "o": ["Quality", "Quantity", "Number", "Demonstrative"], "a": 2}, {"q": "'Pakistani' kis qisam ka adjective hai?", "o": ["Proper adjective", "Interrogative", "Distributive", "Emphasizing"], "a": 0}, {"q": "'He is ___ enough to win.'", "o": ["strongly", "strong", "strength", "strengthen"], "a": 1}, {"q": "Kaunsa adjective of quantity hai?", "o": ["red", "some", "first", "this"], "a": 1}]}, {"t": "Degrees of Comparison", "topic": "Adjective", "pts": ["Teen degrees: Positive (tall), Comparative (taller), Superlative (tallest).", "Chhote adjectives: +er / +est (big → bigger → biggest). Lambay adjectives: more/most (beautiful → more beautiful → most beautiful).", "Irregular: good → better → best, bad → worse → worst, many/much → more → most, little → less → least.", "Comparative ke sath 'than', superlative ke sath 'the' aata hai.", "Ek cheez ko doosri se compare karne par comparative; group mein sab se aala batane par superlative."], "ex": ["Mount Everest is the highest peak.", "My bag is heavier than yours.", "She is the most intelligent student in class."], "quiz": [{"q": "'Bad' ka superlative kya hai?", "o": ["Baddest", "Worst", "Worse", "Most bad"], "a": 1}, {"q": "'She is taller ___ her sister.'", "o": ["from", "then", "than", "to"], "a": 2}, {"q": "'This is the ___ day of my life.'", "o": ["happier", "most happy", "happiest", "more happy"], "a": 2}, {"q": "'Beautiful' ka comparative?", "o": ["Beautifuller", "More beautiful", "Most beautiful", "Beautifuler"], "a": 1}, {"q": "Kaunsa sahi hai?", "o": ["more better", "most best", "better", "gooder"], "a": 2}]}, {"t": "The Verb", "topic": "Verb", "pts": ["Verb action ya state (haalat) batata hai: run, eat, is, seem.", "Main verbs (lexical) khud meaning dete hain: go, write. Helping verbs (auxiliary) main verb ki madad karte hain: is, has, will, can, must.", "Finite verb subject ke mutabiq badalta hai: he goes / they go. Non-finite (to go, going, gone) nahi badalta.", "Transitive verb object leta hai (She bought a car); intransitive nahi leta (She sleeps)."], "ex": ["He is running fast. (is = helping, running = main)", "She has finished her work. (transitive)", "The baby cried loudly. (intransitive)"], "quiz": [{"q": "Kaunsa helping verb hai?", "o": ["run", "quickly", "is", "happy"], "a": 2}, {"q": "'She wrote a letter.' — 'wrote' kis qisam ka verb hai?", "o": ["Intransitive", "Transitive", "Helping", "Linking"], "a": 1}, {"q": "Kaunsa non-finite verb hai?", "o": ["goes", "going", "went", "go"], "a": 1}, {"q": "'They ___ playing cricket.'", "o": ["is", "am", "are", "be"], "a": 2}, {"q": "'The sun rises in the east.' — 'rises' kis qisam ka hai?", "o": ["Transitive", "Intransitive", "Helping", "Modal"], "a": 1}]}, {"t": "Verb forms: principal parts", "topic": "Verb", "pts": ["Har verb ki 3 principal forms: Present (go), Past (went), Past Participle (gone).", "Regular verbs: +d/+ed (play→played→played). Irregular alag-alag hoti hain: eat→ate→eaten, write→wrote→written.", "Present participle: +ing (going) — continuous tenses mein.", "Perfect tenses mein past participle aata hai: has eaten, had written, will have gone."], "ex": ["go → went → gone", "teach → taught → taught", "She has written a letter. (past participle)", "They are playing. (present participle)"], "quiz": [{"q": "'Write' ki 2nd form kya hai?", "o": ["Writed", "Wrote", "Written", "Writing"], "a": 1}, {"q": "'Eat' ki 3rd form?", "o": ["Ate", "Eaten", "Eating", "Eat"], "a": 1}, {"q": "Kaunsa regular verb hai?", "o": ["run", "play", "go", "see"], "a": 1}, {"q": "'He has ___ his homework.'", "o": ["did", "done", "do", "doing"], "a": 1}, {"q": "'They ___ the match yesterday.'", "o": ["win", "won", "winning", "winned"], "a": 1}]}, {"t": "The Adverb", "topic": "Adverb", "pts": ["Adverb verb, adjective ya doosre adverb ko modify karta hai: He runs FAST.", "Kinds: manner (slowly), time (now, yesterday), place (here, there), frequency (always, often, never), degree (very, quite, too).", "Adjective vs adverb: adjective noun ko, adverb verb/adjective ko describe karta hai.", "'Very' degree batata hai: very tall, very slowly."], "ex": ["She sings beautifully. (manner)", "He comes here daily. (place + time)", "The soup is very hot. (degree)", "He spoke quite slowly. (adverb modifying adverb)"], "quiz": [{"q": "Adverb kis ko modify karta hai?", "o": ["Sirf noun", "Verb/adjective/adverb", "Sirf pronoun", "Sirf article"], "a": 1}, {"q": "'Always', 'often', 'never' kis qisam ke adverbs hain?", "o": ["Time", "Place", "Frequency", "Manner"], "a": 2}, {"q": "'She is a ___ dancer.' — sahi lafz?", "o": ["beautiful", "beautifully", "beauty", "beautify"], "a": 0, "w": "Noun 'dancer' ko adjective chahiye."}, {"q": "'He finished the work ___.'", "o": ["quick", "quickly", "quicken", "quickness"], "a": 1}, {"q": "Kaunsa adverb of place hai?", "o": ["now", "here", "very", "always"], "a": 1}]}, {"t": "The Preposition", "topic": "Preposition", "pts": ["Preposition noun/pronoun ka rishta batata hai sentence ke baqi hisse se: in, on, at, under, between.", "Time: at (at 5 o'clock), on (on Monday), in (in July, in 2024).", "Place: at (at the door), on (on the table), in (in the box).", "Common mistakes: afraid OF (not from), depend ON, listen TO, good AT, married TO, different FROM."], "ex": ["The cat is under the chair.", "She was born in 2010. / on 14 August. / at 8 am.", "He is afraid of spiders. (❌ afraid from)"], "quiz": [{"q": "'He is afraid ___ dogs.'", "o": ["from", "of", "with", "by"], "a": 1}, {"q": "'She was born ___ Monday.'", "o": ["in", "on", "at", "by"], "a": 1}, {"q": "'The book is ___ the table.' (sata hua)", "o": ["in", "at", "on", "over"], "a": 2}, {"q": "'Listen ___ your teacher.'", "o": ["at", "on", "to", "for"], "a": 2}, {"q": "Kaunsa preposition of time hai minute/second ke sath?", "o": ["in", "on", "at", "since"], "a": 2}]}, {"test": true, "t": "Weekly Test 2", "topic": "Describing Words"}, {"t": "The Conjunction", "topic": "Conjunction", "pts": ["Conjunction do alfaz, phrases ya clauses ko jorta hai: and, but, or, because, although.", "Coordinating: and, but, or, so, yet — barabar darje ke hisse jorte hain.", "Subordinating: because, although, since, if, when, while — ek clause ko doosre par dependent banate hain.", "Correlative: either...or, neither...nor, not only...but also — joray mein aate hain.", "Sentence shuru mein 'Because' se nahi hota — 'Because it rained, we stayed home.' ya 'We stayed home because it rained.'"], "ex": ["I wanted to play, but it was raining.", "She stayed home because she was ill.", "Neither Ali nor Sara came. (correlative)", "❌ Because it rained. (incomplete) / ✔ It rained heavily."], "quiz": [{"q": "Conjunction ka kaam kya hai?", "o": ["Noun batana", "Words/clauses jorna", "Verb banana", "Question karna"], "a": 1}, {"q": "'Although' kis qisam ki conjunction hai?", "o": ["Coordinating", "Subordinating", "Correlative", "Demonstrative"], "a": 1}, {"q": "'___ Ali ___ Sara came to school.' (dono nahi)", "o": ["Either, or", "Neither, nor", "Not only, but also", "Both, and"], "a": 1}, {"q": "Kaunsa sentence sahi hai?", "o": ["Because he was late.", "He was late because he missed the bus.", "Because the bus.", "Late because."], "a": 1}, {"q": "'and', 'but', 'or' kis qisam ki conjunctions hain?", "o": ["Subordinating", "Coordinating", "Relative", "Interrogative"], "a": 1}]}, {"t": "Interjection + Articles", "topic": "Articles", "pts": ["Interjection achanak jazbaat ka izhar hai: Wow! Alas! Hurrah! Ouch! — is ke baad exclamation mark aata hai.", "Articles 3 hain: a, an, the. 'A/an' kisi aam cheez ki pehli baar baat karte waqt; 'the' khaas (definite) cheez ke liye.", "A consonant SOUND se pehle, AN vowel SOUND se pehle: a university (yoo-), an hour (silent h), an MBA (em-).", "Jangoron, planets (the Earth), rivers, oceans, mountain ranges, superlatives, only/very — sab ke sath 'the' aata hai."], "ex": ["Alas! He lost all his money.", "I saw a dog. The dog was black. (pehli baar a, phir the)", "an honest man / a European country (sound dekhein, letter nahi)"], "quiz": [{"q": "Kaunsa interjection hai?", "o": ["quickly", "Alas!", "under", "because"], "a": 1}, {"q": "'___ apple a day keeps the doctor away.'", "o": ["A", "An", "The", "No article"], "a": 1}, {"q": "'He is ___ honest boy.'", "o": ["a", "an", "the", "no article"], "a": 1, "w": "'hour' ki tarah 'honest' mein h silent hai."}, {"q": "Kaunsa sahi hai?", "o": ["a university", "an university", "a hour", "an European"], "a": 0}, {"q": "Superlative ke sath kaunsa article aata hai?", "o": ["A", "An", "The", "Koi nahi"], "a": 2}]}, {"t": "Articles: advanced use", "topic": "Articles", "pts": ["Uncountable nouns (water, milk, advice, information, furniture) ke sath a/an nahi aata — 'some' ya 'the' use karein.", "Languages, games, subjects, meals ke sath article nahi: play cricket, speak English, have lunch.", "Musical instruments ke sath 'the': play the guitar.", "Buildings/institutions: school (parhai), the school (imarat). He goes to school. / The school is near."], "ex": ["She gave me some advice. (❌ an advice)", "He plays the flute beautifully.", "I have breakfast at 8. / The breakfast was delicious."], "quiz": [{"q": "'She gave me ___ useful information.'", "o": ["a", "an", "some", "many"], "a": 2}, {"q": "'He plays ___ cricket every Sunday.'", "o": ["the", "a", "an", "no article"], "a": 3}, {"q": "'She plays ___ piano very well.'", "o": ["no article", "a", "an", "the"], "a": 3}, {"q": "Kaunsa sahi hai?", "o": ["a furniture", "a news", "a piece of news", "an information"], "a": 2}, {"q": "'___ French is spoken in France.'", "o": ["A", "An", "The", "No article"], "a": 3}]}, {"t": "Present Tenses", "topic": "Tenses", "pts": ["Simple Present: habit/fact — He goes daily. (3rd person singular mein verb+s)", "Present Continuous: abhi ho raha — is/am/are + verb+ing: She is sleeping.", "Present Perfect: abhi khatam hua, time nahi bataya — has/have + 3rd form: I have finished.", "Present Perfect Continuous: shuru se ab tak jaari — has/have been + ing: He has been working since morning.", "since (point of time: since 9 am) vs for (duration: for two hours)."], "ex": ["The sun rises in the east. (fact)", "Look! It is raining.", "I have lived here for ten years.", "She has been studying since 5 o'clock."], "quiz": [{"q": "'Water ___ at 100°C.'", "o": ["boil", "boils", "is boiling", "boiled"], "a": 1}, {"q": "'Look! The baby ___.'", "o": ["cries", "is crying", "has cried", "cry"], "a": 1}, {"q": "'I ___ just ___ my lunch.'", "o": ["have, finished", "has, finished", "am, finish", "had, finish"], "a": 0}, {"q": "'She has been waiting ___ two hours.'", "o": ["since", "for", "from", "at"], "a": 1}, {"q": "'since' kis ke sath aata hai?", "o": ["Duration", "Point of time", "Future", "Never"], "a": 1}]}, {"t": "Past Tenses", "topic": "Tenses", "pts": ["Simple Past: guzra waqt, khatam — He went yesterday.", "Past Continuous: past mein jaari kaam — was/were + ing: They were playing.", "Past Perfect: do past kaamon mein pehla wala — had + 3rd form: The train had left before I reached.", "Past Perfect Continuous: had been + ing — duration + past kaam: She had been cooking for an hour.", "Past simple mein did/didn't ke baad verb ki 1st form: Did you go? (❌ Did you went?)"], "ex": ["We visited Lahore last year.", "When I arrived, they were having dinner.", "He had already left when I called."], "quiz": [{"q": "'I ___ him yesterday.'", "o": ["see", "seen", "saw", "seeing"], "a": 2}, {"q": "'They ___ TV when the lights went off.'", "o": ["watch", "were watching", "have watched", "had watched"], "a": 1}, {"q": "'The patient ___ before the doctor came.'", "o": ["has died", "had died", "dies", "is dying"], "a": 1}, {"q": "Kaunsa sahi hai?", "o": ["Did you went?", "Did you go?", "Did you gone?", "Did you going?"], "a": 1}, {"q": "'She had been working there ___ 2015.' (us waqt tak)", "o": ["for", "since", "from", "ago"], "a": 1}]}, {"t": "Future Tenses", "topic": "Tenses", "pts": ["Simple Future: will/shall + 1st form: I will help you.", "Future Continuous: will be + ing: They will be travelling tomorrow.", "Future Perfect: will have + 3rd form — future mein pehle mukammal: She will have left by 6 pm.", "Future Perfect Continuous: will have been + ing — duration ke sath.", "Going to: pehle se irada ya imkaan: It is going to rain. (kaale baadal)"], "ex": ["I shall write to you soon.", "This time tomorrow, I will be flying to Karachi.", "They will have finished the project by Friday."], "quiz": [{"q": "'I ___ call you tonight.'", "o": ["will", "am", "have", "had"], "a": 0}, {"q": "'Next year, we ___ in this city for 20 years.'", "o": ["will live", "will have been living", "have lived", "live"], "a": 1}, {"q": "'Look at the clouds! It ___ rain.'", "o": ["will", "is going to", "has", "would"], "a": 1}, {"q": "'By 6 pm, they ___ the match.'", "o": ["will finish", "will have finished", "finish", "finished"], "a": 1}, {"q": "Future continuous ka structure?", "o": ["will + verb", "will be + ing", "will have + 3rd", "be + ing"], "a": 1}]}, {"test": true, "t": "Weekly Test 3", "topic": "Joining & Tenses"}, {"t": "Tenses Revision + Error Spotting", "topic": "Tenses", "pts": ["Tenses ka pasandeeda sawal: sentence mein time words dekhein (yesterday → past, tomorrow → future, now → continuous).", "Agar sentence mein pehla kaam ho chuka ho (before, after, already, by the time) to past perfect: had + 3rd form.", "Since + point of time, for + duration — perfect tenses ke sath.", "Continuous verbs (like, love, know, believe) continuous form mein nahi aate: ❌ I am knowing you. ✔ I know you."], "ex": ["When we reached the station, the train had departed.", "I know him well. (❌ am knowing)", "She has been ill since Monday. / for a week."], "quiz": [{"q": "'When I reached the cinema, the movie ___.'", "o": ["started", "has started", "had started", "starts"], "a": 2}, {"q": "Kaunsa sahi hai?", "o": ["I am knowing the answer.", "I know the answer.", "I knowing the answer.", "I am know the answer."], "a": 1}, {"q": "'She ___ here since 2019.'", "o": ["lives", "is living", "has been living", "lived"], "a": 2}, {"q": "'Look! It ___ .'", "o": ["rains", "rained", "is raining", "has rained"], "a": 2}, {"q": "'I ___ this book last week.'", "o": ["buy", "have bought", "bought", "buying"], "a": 2}]}, {"t": "Subject-Verb Agreement I", "topic": "Agreement", "pts": ["Verb hamesha subject ke mutabiq hota hai, us ke kareeb wale noun ke mutabiq nahi.", "Two subjects 'and' se jurein to plural verb: Ali and Sara are friends.", "Subjects 'each', 'every', 'everyone', 'nobody' singular verb lete hain: Each boy has a pen.", "'There is/are' mein verb asal subject ke mutabiq hota hai: There are two books on the table."], "ex": ["The quality of the apples was good. (quality = singular)", "Every student and teacher was present. (each/every → singular)", "There is a boy and two girls. (pehla subject 'a boy' singular)"], "quiz": [{"q": "'Each of the students ___ a book.'", "o": ["have", "has", "are having", "having"], "a": 1}, {"q": "'Bread and butter ___ my breakfast.' (ek combination)", "o": ["are", "is", "were", "have been"], "a": 1}, {"q": "'The teacher, as well as the students, ___ present.'", "o": ["were", "was", "are", "have been"], "a": 1, "w": "'As well as' ke baad wala subject verb par asar nahi daltay."}, {"q": "'There ___ two boys in the room.'", "o": ["is", "are", "was", "be"], "a": 1}, {"q": "'Neither of the answers ___ correct.'", "o": ["are", "is", "were", "be"], "a": 1}]}, {"t": "Subject-Verb Agreement II", "topic": "Agreement", "pts": ["Some nouns hamesha plural lete hain: cattle, people, police, scissors — The police have arrested him.", "Uncountable nouns singular verb leti hain: The news is shocking. / The furniture is new.", "Titles of books, sums, distances — singular: 'The Arabian Nights' is a famous book. / Ten years is a long time.", "Collective noun ek unit ki tarah ho to singular, members ki tarah to plural: The team is winning. / The team are arguing."], "ex": ["His luggage was lost. (uncountable)", "The cattle are grazing in the field.", "Five hundred rupees is too much for this."], "quiz": [{"q": "'The news ___ very sad.'", "o": ["are", "is", "were", "have been"], "a": 1}, {"q": "'The police ___ arrested the thief.'", "o": ["has", "have", "is", "was"], "a": 1}, {"q": "'The furniture in this room ___ new.'", "o": ["are", "is", "were", "have been"], "a": 1}, {"q": "'Gulliver's Travels ___ an interesting book.'", "o": ["are", "is", "were", "have been"], "a": 1}, {"q": "'The committee ___ taken its decision.' (ek unit)", "o": ["have", "has", "are", "were"], "a": 1}]}, {"t": "Active → Passive Voice I", "topic": "Passive Voice", "pts": ["Active: subject kaam karta hai — 'Ali eats an apple.' Passive: subject par kaam hota hai — 'An apple is eaten by Ali.'", "Passive = object + be (tense ke mutabiq) + 3rd form (+ by + subject, zaroorat ho to).", "Simple Present: is/am/are + 3rd form. Simple Past: was/were + 3rd form.", "Object banne wala subject (An apple) passive sentence ka naya subject hai — verb is ke sath."], "ex": ["She writes a letter. → A letter is written by her.", "They built a house. → A house was built by them.", "He eats mangoes. → Mangoes are eaten by him."], "quiz": [{"q": "'She sings a song.' ka passive?", "o": ["A song is sung by her.", "A song is sing by her.", "A song was sung by her.", "A song sung by her."], "a": 0}, {"q": "'The boys kicked the ball.' → ?", "o": ["The ball is kicked.", "The ball was kicked by the boys.", "The ball kicked.", "The ball has kicked."], "a": 1}, {"q": "Passive voice mein verb ki kaunsi form aati hai?", "o": ["1st", "2nd", "3rd", "ing"], "a": 2}, {"q": "'He teaches English.' → ?", "o": ["English is teach by him.", "English is taught by him.", "English taught by him.", "English was teach by him."], "a": 1}, {"q": "Simple present passive ka structure?", "o": ["is/am/are + 3rd form", "was/were + 3rd form", "will be + 3rd form", "has been + ing"], "a": 0}]}, {"t": "Passive Voice II: all tenses", "topic": "Passive Voice", "pts": ["Present Continuous: is/am/are being + 3rd form — The car is being repaired.", "Present Perfect: has/have been + 3rd form — The work has been done.", "Past Perfect: had been + 3rd form — The letter had been posted.", "Future: will be + 3rd form — The match will be played tomorrow.", "Modals: modal + be + 3rd form — Rules must be followed."], "ex": ["They are repairing the road. → The road is being repaired.", "Someone has stolen my phone. → My phone has been stolen.", "You should obey your parents. → Your parents should be obeyed."], "quiz": [{"q": "'They are building a bridge.' → ?", "o": ["A bridge is built.", "A bridge is being built.", "A bridge has built.", "A bridge built."], "a": 1}, {"q": "'She has finished the project.' → ?", "o": ["The project is finished.", "The project has been finished.", "The project was finish.", "The project finished."], "a": 1}, {"q": "'He will write a letter.' → ?", "o": ["A letter will written.", "A letter will be written.", "A letter will been written.", "A letter will write."], "a": 1}, {"q": "'You must wash these clothes.' → ?", "o": ["These clothes must washed.", "These clothes must be washed.", "These clothes must been washed.", "These clothes washed."], "a": 1}, {"q": "Past perfect passive ka structure?", "o": ["had + 3rd form", "had been + 3rd form", "was + 3rd form", "has been + 3rd form"], "a": 1}]}, {"t": "Passive: questions & imperatives", "topic": "Passive Voice", "pts": ["Yes/No questions: Is the letter written? / Was the match won?", "WH-questions: By whom was this done? / Why was he punished?", "Imperatives (hukum): Let + object + be + 3rd form — Open the door. → Let the door be opened.", "Negative imperative: Do not touch it. → Let it not be touched.", "Sentences jin ka object nahi (intransitive) passive nahi ban sakte: He sleeps. ❌"], "ex": ["Do you speak English? → Is English spoken by you?", "Post this letter. → Let this letter be posted.", "Who taught you? → By whom were you taught?"], "quiz": [{"q": "'Open the window.' → ?", "o": ["The window is opened.", "Let the window be opened.", "The window opened.", "Window be open."], "a": 1}, {"q": "'She was cooking food.' → ?", "o": ["Food was being cooked by her.", "Food was cooked by her.", "Food is being cooked.", "Food cooked."], "a": 0}, {"q": "'Who broke the chair?' → ?", "o": ["The chair was broke by who?", "By whom was the chair broken?", "Whom broke the chair?", "The chair broken by whom?"], "a": 1}, {"q": "Kaunsa sentence passive nahi ban sakta?", "o": ["She sings a song.", "He runs fast.", "They play hockey.", "We read books."], "a": 1, "w": "'Runs' intransitive hai — object nahi."}, {"q": "'People speak English worldwide.' → ?", "o": ["English is spoken worldwide.", "English spoken worldwide.", "English is speak worldwide.", "English was speak worldwide."], "a": 0}]}, {"test": true, "t": "Weekly Test 4", "topic": "Agreement & Voice"}, {"t": "Direct & Indirect Speech: Statements", "topic": "Narration", "pts": ["Direct speech: kisi ke alfaz bilkul waise: He said, 'I am tired.' Indirect: He said that he was tired.", "Reporting verb 'said' ke baad 'that' lagata hain (optional).", "Tense backshift: am/is → was, will → would, has → had, simple present → simple past, past → past perfect.", "Pronouns aur time/place words bhi badalte hain: now → then, today → that day, here → there, this → that, tomorrow → the next day.", "Agar reporting verb past mein ho to backshift hota hai; universal truth mein nahi: He said that the earth revolves around the sun."], "ex": ["She said, 'I like tea.' → She said that she liked tea.", "He said, 'I will go tomorrow.' → He said that he would go the next day.", "The teacher said, 'Water boils at 100°C.' → ...that water boils at 100°C."], "quiz": [{"q": "He said, 'I am happy.' → ?", "o": ["He said that he is happy.", "He said that he was happy.", "He said that I am happy.", "He said he happy."], "a": 1}, {"q": "'today' indirect speech mein kya ban jata hai?", "o": ["tomorrow", "that day", "now", "yesterday"], "a": 1}, {"q": "'will' ka backshift kya hai?", "o": ["shall", "would", "should", "had"], "a": 1}, {"q": "Universal truth ke sath tense ___?", "o": ["Badalta hai", "Nahi badalta", "Future ban jata hai", "Delete ho jata hai"], "a": 1}, {"q": "She said, 'I have finished my work.' → ?", "o": ["She said that she has finished.", "She said that she had finished.", "She said that she finished.", "She said she finish."], "a": 1}]}, {"t": "Narration: Questions, Commands, Requests", "topic": "Narration", "pts": ["Yes/No questions: asked + if/whether — He said, 'Are you ill?' → He asked if I was ill.", "WH-questions: asked + wh-word, question mark nahi, sentence order normal: 'Where do you live?' → He asked where I lived.", "Commands (hukum): ordered/told + to + 1st form — 'Sit down.' → He ordered me to sit down.", "Requests: requested + to + 1st form — 'Please help me.' → He requested me to help him.", "Negative commands: told + not to + verb — 'Don't go.' → He told me not to go."], "ex": ["She said, 'Do you like mangoes?' → She asked if I liked mangoes.", "He said, 'Where are you going?' → He asked where I was going.", "The teacher said, 'Don't make a noise.' → The teacher told us not to make a noise."], "quiz": [{"q": "'He said, \"Do you play cricket?\"' → ?", "o": ["He asked that did I play cricket.", "He asked if I played cricket.", "He asked me play cricket.", "He asked if I play."], "a": 1}, {"q": "'She said, \"What is your name?\"' → ?", "o": ["She asked what my name was.", "She asked what was my name.", "She asked my name.", "She said what is my name."], "a": 0}, {"q": "'The captain said, \"March forward.\"' → ?", "o": ["The captain said march forward.", "The captain ordered them to march forward.", "The captain told marching.", "The captain said to marching."], "a": 1}, {"q": "'Mother said, \"Please bring me some water.\"' → ?", "o": ["Mother ordered bring water.", "Mother requested me to bring her some water.", "Mother said bringing water.", "Mother told water."], "a": 1}, {"q": "Indirect question ke baad ___ lagta hai?", "o": ["Question mark", "Full stop", "Exclamation", "Comma"], "a": 1}]}, {"t": "Narration: Exclamations & Mixed", "topic": "Narration", "pts": ["Exclamations (wah! shabash!): exclaimed with joy/sorrow/wonder + that — 'Alas! I am ruined.' → He exclaimed with sorrow that he was ruined.", "'Wow/ Hurrah' → exclaimed with joy; 'Alas' → with sorrow; 'Wow! What a...' → with wonder/surprise.", "Wish/sentence with 'would that': wished that — 'Would that I were a king!' → He wished that he were a king.", "Mixed practice: pehle reporting verb dekhen (said/asked/ordered), phir sentence ka type (statement/question/command), phir rules lagayen."], "ex": ["He said, 'Hurrah! We have won.' → He exclaimed with joy that they had won.", "She said, 'What a beautiful garden!' → She exclaimed with wonder that it was a very beautiful garden."], "quiz": [{"q": "'He said, \"Alas! My brother is dead.\"' → ?", "o": ["He exclaimed with joy...", "He exclaimed with sorrow that his brother was dead.", "He said alas.", "He told his brother dead."], "a": 1}, {"q": "'Hurrah!' ke liye kaunsa reporting verb sahi hai?", "o": ["exclaimed with sorrow", "exclaimed with joy", "said sadly", "asked"], "a": 1}, {"q": "'Would that I were rich!' → ?", "o": ["He said would that.", "He wished that he were rich.", "He ordered to be rich.", "He asked if rich."], "a": 1}, {"q": "'She said, \"What a lovely dress!\"' → ?", "o": ["She exclaimed with wonder that it was a lovely dress.", "She said what dress.", "She asked the dress.", "She ordered the dress."], "a": 0}, {"q": "'Please' wala sentence usually kis mein badalta hai?", "o": ["Order", "Request", "Exclamation", "Statement"], "a": 1}]}, {"t": "Modals: can, could, may, might", "topic": "Modals", "pts": ["Modals helping verbs hain jo ability, permission, possibility dikhate hain — in ke baad hamesha verb ki 1st form aati hai (to nahi).", "can = ability/fi'l halat: I can swim. could = past ability ya zarfi se darkhwast: Could you help me?", "may = permission ya possibility: May I come in? It may rain today.", "might = kam possibility (may se zyada halka): It might rain, but I doubt it.", "can't = na mumkin; couldn't = past mein na mumkin."], "ex": ["She can speak three languages.", "Could you pass the salt, please? (zarfi)", "It may rain later, so take an umbrella.", "He couldn't solve the problem yesterday."], "quiz": [{"q": "Modals ke baad verb ki kaunsi form aati hai?", "o": ["2nd form", "3rd form", "1st form (to ke baghair)", "ing form"], "a": 2}, {"q": "'She ___ play the piano very well.' (ability)", "o": ["may", "can", "might", "must"], "a": 1}, {"q": "Darkhwast ke liye sab se zarfi lafz?", "o": ["can", "could", "must", "shall"], "a": 1}, {"q": "'___ I come in, Sir?' (permission)", "o": ["Can", "May", "Must", "Will"], "a": 1, "w": "Formal permission ke liye 'may' zyada behtar hai."}, {"q": "'It ___ rain tonight, but I am not sure.' (kam possibility)", "o": ["will", "must", "might", "can"], "a": 2}]}, {"t": "Modals: shall, should, will, would, must", "topic": "Modals", "pts": ["shall: offers/suggestions — Shall we go? will: future/willingness — I will help you.", "should: mashwara — You should sleep early. shouldn't: mana — You shouldn't smoke.", "must: zaroori baat (speaker ki taraf se) — You must wear a helmet. / mustn't = sakhti se mana.", "would: past habit ya zarfi request — He would walk daily. / Would you mind...?", "ought to = should (zimmedari): We ought to respect our elders."], "ex": ["You should see a doctor.", "We must obey the law.", "He would visit us every Friday. (past habit)", "Would you mind opening the window?"], "quiz": [{"q": "Mashware ke liye kaunsa modal?", "o": ["must", "should", "may", "will"], "a": 1}, {"q": "'You ___ stop at a red light.' (qanoon — zaroori)", "o": ["should", "must", "might", "could"], "a": 1}, {"q": "Past habit ke liye kaunsa modal?", "o": ["will", "shall", "would", "can"], "a": 2}, {"q": "'___ we start the meeting?' (suggestion)", "o": ["Will", "Shall", "Would", "Must"], "a": 1}, {"q": "'ought to' ka matlab kya hai?", "o": ["Permission", "Zimmedari/mashwara", "Past habit", "Ability"], "a": 1}]}, {"t": "Modals: must, ought to, need, used to", "topic": "Modals", "pts": ["must vs have to: must speaker ki zaroorat, have to external rule: I must study. / I have to wear a uniform.", "needn't = zaroorat nahi: You needn't come early. (need as modal negative/interrogative mein)", "used to = purani aadat ya past state: I used to live in Karachi. / didn't use to", "dare = himmat: How dare you! / dare not", "Modals ka past form: must → had to, will → would, can → could, may → might, shall → should."], "ex": ["I used to play cricket in my childhood.", "You needn't bring anything; just come.", "We had to cancel the trip. (must ka past)"], "quiz": [{"q": "'I ___ live in Lahore, but now I live in Karachi.' (purani aadat)", "o": ["use to", "used to", "am used to", "using to"], "a": 1}, {"q": "'You ___ come if you don't want to.' (zaroorat nahi)", "o": ["mustn't", "needn't", "shouldn't", "won't"], "a": 1}, {"q": "'must' ka past tense kya hai?", "o": ["musted", "had to", "would", "should"], "a": 1}, {"q": "'We ___ to wear a uniform at school.' (external rule)", "o": ["must", "have", "should", "may"], "a": 1}, {"q": "Kaunsa modal past state batata hai?", "o": ["will", "used to", "shall", "might"], "a": 1}]}, {"test": true, "t": "Weekly Test 5", "topic": "Narration & Modals"}, {"t": "Analysis of a Simple Sentence", "topic": "Sentence Analysis", "pts": ["Simple sentence mein ek hi finite verb aur ek subject hota hai, chahe kitne hi parts hon.", "Do kinds ke parts: Subject (karta/kis ke baray mein) aur Predicate (kya kehna hai).", "Predicate ke andar: Verb → Object (agar transitive) → Complement (agar linking verb).", "Pattern 1: S+V (He sleeps.) Pattern 2: S+V+O (She eats apples.) Pattern 3: S+V+C (He is happy.)", "Question words se analysis: 'Who/what did it?' = Subject; 'did what?' = Verb; 'whom/what?' = Object."], "ex": ["The tall boy kicked the ball. → S: The tall boy | V: kicked | O: the ball", "My father is a doctor. → S | V(is) | C: a doctor", "She seems tired. → V(seems) linking, C: tired"], "quiz": [{"q": "Simple sentence mein finite verbs kitne hote hain?", "o": ["2", "1", "3", "Jitne chahin"], "a": 1}, {"q": "'is/am/seem/become' jaise verbs ke baad kya aata hai?", "o": ["Object", "Complement", "Adverb", "Article"], "a": 1}, {"q": "'The old man gave the boy a gift.' — 'a gift' kya hai?", "o": ["Subject", "Verb", "Indirect object ka direct object (O)", "Complement"], "a": 2}, {"q": "'Birds fly.' mein pattern kya hai?", "o": ["S+V+O", "S+V", "S+V+C", "S+O+V"], "a": 1}, {"q": "Complement kis se pooch kar milta hai?", "o": ["Kis ne?", "Kya kiya?", "Kya/kesa hai?", "Kab?"], "a": 2}]}, {"t": "Phrases", "topic": "Phrases & Clauses", "pts": ["Phrase alfaz ka wo group jisme finite verb NAHI hota: in the morning, to go home, very tall.", "Noun phrase: The tall boy (noun + us ke modifiers). Function: subject/object ban sakta hai.", "Adjective phrase: very beautiful — noun ke baray mein batata hai.", "Adverb phrase: very quickly, in the morning — verb ko modify karta hai.", "Phrase ko sentence mein identify karne ka tareeqa: us ke andar finite verb talash karein — nahi to phrase hai."], "ex": ["The boy in the blue shirt is my brother. (adjective phrase)", "She ran very fast. (adverb phrase)", "To win the match is our goal. (noun phrase as subject)", "in the garden (phrase — koi verb nahi)"], "quiz": [{"q": "Phrase ki pehchan kya hai?", "o": ["Finite verb hota hai", "Finite verb nahi hota", "Hamesha question mark", "Sirf 2 words"], "a": 1}, {"q": "'The girl with long hair' kaunsa phrase hai?", "o": ["Noun phrase", "Adjective phrase", "Adverb phrase", "Verb phrase"], "a": 1, "w": "Noun 'girl' ko describe kar raha hai."}, {"q": "Kaunsa phrase adverbial kaam kar raha hai?", "o": ["in the box", "very tall", "with great speed (she worked)", "the tall man"], "a": 2}, {"q": "'He worked with great care.' — 'with great care' kya hai?", "o": ["Subject", "Verb", "Adverb phrase", "Object"], "a": 2}, {"q": "Phrase mein kitne alfaz hone zaroori hain?", "o": ["Sirf 2", "Kam az kam 2 — jazbaati group", "Hamesha 4", "Sirf 3"], "a": 1}]}, {"t": "Clauses: Main & Subordinate", "topic": "Phrases & Clauses", "pts": ["Clause = alfaz ka group jisme FINITE VERB hoti hai. Phrase se yahi farq hai.", "Main (independent) clause: khud mukammal sentence — She passed the exam.", "Subordinate (dependent) clause: khud adhoora, main clause par nirbhar — because she worked hard.", "Subordinating conjunctions (because, although, if, when, since, that) subordinate clause ko jorte hain.", "Main clause ko hata kar dekhein — sentence toot jaye to wo subordinate hai."], "ex": ["I stayed home because it was raining. (main: I stayed home | sub: because it was raining)", "She said that she was happy. (subordinate: that she was happy)", "When the bell rang, the students left. (subordinate pehle — comma lagta hai)"], "quiz": [{"q": "Clause aur phrase ka asli farq kya hai?", "o": ["Alfaz ki ginti", "Finite verb mojood hai ya nahi", "Comma", "Question mark"], "a": 1}, {"q": "Kaunsi main clause hai?", "o": ["because he was ill", "She went home", "that he will come", "if it rains"], "a": 1}, {"q": "Subordinate clause hata dene se kya hota hai?", "o": ["Sentence mukammal rehta hai", "Sentence adhoora reh jata hai", "Kuch nahi", "Sentence bara ho jata hai"], "a": 1}, {"q": "'___ it rained, we stayed inside.'", "o": ["Because", "It", "The rain", "Heavy"], "a": 0}, {"q": "'that' kis tarah ki conjunction hai?", "o": ["Coordinating", "Subordinating", "Correlative", "Interjection"], "a": 1}]}, {"t": "Clauses: Noun, Adjective, Adverb", "topic": "Phrases & Clauses", "pts": ["Noun clause: noun ka kaam karta hai (subject/object/complement): What he said is true.", "Adjective clause: noun/pronoun ko describe karta hai, who/which/that se shuru: The man who came...", "Adverb clause: verb ko modify karta hai (time, reason, condition, place): when he arrived, because she was ill.", "Adjective clause ko identifying (the boy who stole...) aur non-identifying (My brother, who lives in Lahore, ...) mein divide karte hain — non-identifying mein commas lagte hain."], "ex": ["What you say is right. (noun clause = subject)", "I know that he is honest. (noun clause = object)", "The girl who won is my cousin. (adjective clause)", "He left when the bell rang. (adverb clause of time)"], "quiz": [{"q": "'What he said is true.' — 'What he said' kis clause hai?", "o": ["Noun clause", "Adjective clause", "Adverb clause", "Main clause"], "a": 0}, {"q": "'The house which is white belongs to me.' — 'which is white'?", "o": ["Noun clause", "Adjective clause", "Adverb clause", "Phrase"], "a": 1}, {"q": "'She cried because she was hurt.' — 'because she was hurt'?", "o": ["Noun", "Adjective", "Adverb clause", "Main"], "a": 2}, {"q": "Noun clause kaunsa kaam nahi kar sakta?", "o": ["Subject", "Object", "Complement", "Verb ko modify karna"], "a": 3}, {"q": "'I believe ___ he is right.'", "o": ["which", "that", "when", "where"], "a": 1}]}, {"t": "Compound Sentences", "topic": "Sentence Analysis", "pts": ["Compound sentence = do (ya zyada) INDEPENDENT clauses, coordinating conjunction (and, but, or, so, yet) se jure.", "Dono clauses akele bhi mukammal sentence hain: He is poor but he is honest.", "Conjunction ke ilawa semicolon (;) bhi clauses jor sakta hai: He came; he saw; he conquered.", "Compound sentence mein koi subordinate clause nahi hota — yahi us ki pehchan hai.", "Comma coordinating conjunction se pehle lagta hai."], "ex": ["I wanted to go out, but it was raining. (dono clauses independent)", "She is rich, yet she is not happy.", "He studied hard, so he passed."], "quiz": [{"q": "Compound sentence mein clauses kaise jure hote hain?", "o": ["Subordinating se", "Coordinating conjunction se", "Relative pronoun se", "Comma se hi"], "a": 1}, {"q": "Kaunsa compound sentence hai?", "o": ["Because he was ill, he left.", "He is poor but he is honest.", "The boy who came is Ali.", "Running in the park."], "a": 1}, {"q": "Semicolon (;) kis kaam aata hai?", "o": ["Pause se pehle", "Independent clauses jorne", "List ke aakhir mein", "Question ke baad"], "a": 1}, {"q": "'and, but, or, so, yet' kis qisam ki conjunctions hain?", "o": ["Subordinating", "Coordinating", "Correlative", "Relative"], "a": 1}, {"q": "Compound sentence ki pehchan?", "o": ["Ek hi verb", "Subordinate clause", "Do independent clauses", "Koi verb nahi"], "a": 2}]}, {"t": "Complex Sentences", "topic": "Sentence Analysis", "pts": ["Complex sentence = 1 main clause + kam az kam 1 subordinate clause.", "Main clause sentence ki reed ki haddi (backbone) hai; subordinate clause us ka aik hissa (subject, object, adverbial).", "Subordinate clause kahin bhi aa sakta hai — shuru, beech, ya aakhir.", "Complex aur compound ka farq: compound mein SAB clauses independent; complex mein EK dependent hoti hai.", "Although, because, since, if, when, that, who, which — in se subordinate clause banta hai."], "ex": ["Although it was raining, we went out. (subordinate pehle)", "We went out although it was raining. (subordinate aakhir)", "The book that I bought is interesting. (adjective clause)"], "quiz": [{"q": "Complex sentence ki pehchan?", "o": ["Do independent clauses", "Ek main + kam az kam ek subordinate clause", "Teen clauses", "Koi verb nahi"], "a": 1}, {"q": "Kaunsa complex sentence hai?", "o": ["He came and he saw.", "Because it rained, the match was cancelled.", "He is poor but honest.", "Run!"], "a": 1}, {"q": "Complex sentence ka main clause kya hai?", "o": ["Sentence ka aham hissa jo adhoora ho", "Sentence ka aham hissa jo mukammal ho", "Pehla lafz", "Aakhir ka lafz"], "a": 1}, {"q": "Kaunsa sentence compound hai?", "o": ["She failed because she was lazy.", "He ran fast, so he won.", "The man who came is my uncle.", "If you work hard, you will pass."], "a": 1}, {"q": "Subordinate clause sentence mein kahan aa sakta hai?", "o": ["Sirf shuru mein", "Sirf aakhir mein", "Kahin bhi", "Beech mein hi"], "a": 2}]}, {"test": true, "t": "Weekly Test 6", "topic": "Sentence Analysis"}, {"t": "Synthesis of Sentences I", "topic": "Synthesis", "pts": ["Synthesis = do ya zyada simple sentences ko jor kar ek naya sentence banana.", "Participles se jorna: He saw a lion. He ran away. → Seeing a lion, he ran away.", "Absolute phrases: The sun set. We returned home. → The sun having set, we returned home.", "Prepositions ke zariye: He is rich. He is not happy. → In spite of being rich, he is not happy.", "Joray mein aa rahi common cheez ko ek dafa likhein: I have a pen. The pen is red. → I have a red pen."], "ex": ["He was ill. He went to office. → In spite of being ill, he went to office.", "She finished her work. She went home. → Having finished her work, she went home."], "quiz": [{"q": "Synthesis ka matlab?", "o": ["Sentence torna", "Sentences jorna", "Spellings likhna", "Translation"], "a": 1}, {"q": "'Seeing a lion, he ran away.' mein 'seeing' kya hai?", "o": ["Present participle", "Past tense", "Conjunction", "Preposition"], "a": 0}, {"q": "'The sun having set, we went home.' mein 'The sun having set' kya hai?", "o": ["Noun clause", "Absolute phrase", "Main clause", "Question"], "a": 1}, {"q": "'In spite of ___ rich, he is sad.'", "o": ["be", "being", "been", "is"], "a": 1}, {"q": "Do sentences jorne ka sab se aasan tareeqa?", "o": ["Dono ko alag likhna", "Common cheez ko ek dafa likhna", "Pehle sentence ko delete karna", "Comma se sirf jorna"], "a": 1}]}, {"t": "Synthesis of Sentences II", "topic": "Synthesis", "pts": ["'Too...to' structure: bohat...ke nahi — He is too weak to walk. (wo itna kamzor hai ke nahi chal sakta)", "'So...that' structure: itna...ke — He is so weak that he cannot walk.", "Conjunctions se jorna: and, but, or, not only...but also — He is wise. He is brave. → He is not only wise but also brave.", "Relative pronoun se: I met a man. He was a doctor. → I met a man who was a doctor.", "Apposition: do nouns ek hi cheez ke liye — Mr. Ahmed, our teacher, is kind."], "ex": ["The box is too heavy to lift.", "She is so tired that she cannot stand.", "I bought a book. It was interesting. → I bought a book which was interesting."], "quiz": [{"q": "'He is ___ weak ___ walk.' (too...to structure)", "o": ["so, that", "too, to", "very, and", "much, but"], "a": 1}, {"q": "'too...to' ka matlab?", "o": ["Bohat...ke (nahi kar sakta)", "Thora sa", "Sirf", "Hamesha"], "a": 0}, {"q": "'She is ___ clever ___ everyone likes her.'", "o": ["too, to", "so, that", "as, as", "not, but"], "a": 1}, {"q": "'The man ___ came was a doctor.'", "o": ["which", "who", "whom", "whose"], "a": 1}, {"q": "Apposition kya hai?", "o": ["Do verbs ka jorna", "Do nouns ka ek hi cheez ke liye aana", "Ek clause torna", "Question banana"], "a": 1}]}, {"t": "Transformation of Sentences I", "topic": "Transformation", "pts": ["Transformation = sentence ka matlab wahi, structure naya: affirmative ↔ negative, assertive ↔ interrogative.", "Negative banane ke liye: not, never, no one, nothing, hardly, scarcely — He is honest. → He is not dishonest. (double negative = positive meaning)", "Assertive → Interrogative: He is a good boy. → Isn't he a good boy? / Who doesn't know him?", "Affirmative banane ke liye 'not...un-' trick: This is not useless. = This is useful.", "Very/exceedingly ki jagah too/so...that ya 'of + noun' style: He is very kind. → He is kindness itself."], "ex": ["Nobody can deny his honesty. = Everybody accepts his honesty.", "She is very intelligent. → Isn't she very intelligent? (interrogative, same meaning)"], "quiz": [{"q": "Transformation mein kya nahi badalta?", "o": ["Structure", "Word order", "Matlab", "Voice"], "a": 2}, {"q": "'He is not dishonest.' — yeh sentence kya dikhata hai?", "o": ["Dishonest hai", "Honest hai (double negative)", "Behooda hai", "Kuch nahi"], "a": 1}, {"q": "'Nobody can do it.' — iska affirmative kya hoga?", "o": ["Everybody can do it.", "Everybody cannot do it.", "Anybody can do it.", "Nobody cannot do it."], "a": 1}, {"q": "'Very' wali degree dikhane ke liye kaunsa structure?", "o": ["too...to", "so...that", "not only...but also", "no sooner...than"], "a": 1}, {"q": "Assertive sentence kya hota hai?", "o": ["Sawal", "Hukum", "Seedhi statement", "Jazbaat"], "a": 2}]}, {"t": "Transformation of Sentences II", "topic": "Transformation", "pts": ["Comparative/superlative transformation: No other boy is as tall as Ali. = Ali is taller than any other boy. = Ali is the tallest boy.", "'As soon as' ↔ 'No sooner...than': No sooner did he see the police than he ran away.", "'Since' ↔ 'It is...since': I met him last year. → It is a year since I met him.", "Conditional transformation: If you don't work hard, you will fail. → Unless you work hard, you will fail.", "Exclamatory ↔ Assertive: What a beautiful day! → It is a very beautiful day."], "ex": ["No sooner had she finished than the bell rang.", "Unless you hurry, you will miss the bus.", "How kind of you! → You are very kind."], "quiz": [{"q": "'No sooner ___ he arrive ___ the phone rang.'", "o": ["had, than", "did, when", "has, then", "was, as"], "a": 0}, {"q": "'If you do not hurry, you will miss it.' — Unless wala structure?", "o": ["Unless you hurry, you will miss it.", "Unless you don't hurry, you will miss it.", "Unless hurry, missing.", "Unless you will miss it."], "a": 0}, {"q": "'What a lovely day!' — assertive?", "o": ["It is a lovely day.", "Is it a lovely day?", "How lovely a day is.", "What day lovely."], "a": 0}, {"q": "'As soon as he came, she left.' — no sooner structure?", "o": ["No sooner did he come than she left.", "No sooner he came than she left.", "No sooner he come when she left.", "No sooner than he came she left."], "a": 0}, {"q": "'Ali is taller than any other boy.' — iska matlab?", "o": ["Ali sab se lamba hai", "Ali lamba hai lekin koi aur bhi", "Ali chhota hai", "Ali ka koi tall nahi"], "a": 0}]}, {"t": "Punctuation I", "topic": "Punctuation", "pts": ["Full stop (.) statement ke aakhir mein; capital l  let totalR=0,totalN=0;for(const t in topics){totalR+=topics[t].r;totalN+=topics[t].n}
 const acc=totalN?Math.round(totalR/totalN*100):0;
 let h='<div class="statrow"><div class="stat"><div class="v">'+acc+'%</div><p>Accuracy</p></div><div class="stat"><div class="v">'+Object.keys(S.quiz).length+'</div><p>Quizzes</p></div><div class="stat"><div class="v">'+S.best+'</div><p>Best streak</p></div></div>';
 h+='<div class="card"><h2>🏅 Aap ki achievements</h2><p>🌟 Best day: <b style="color:var(--txt)">'+(bestDay?'Day '+bestDay+' ('+bestPct+'%)':'—')+'</b></p><p>🏆 Best week: <b style="color:var(--txt)">'+(bestW?'Week '+bestW+' ('+bestWp+'%)':'—')+'</b></p><p>📈 Total answers: '+totalN+'</p></div>';
 h+='<div class="card"><h2>📊 Topic accuracy</h2>'+Object.keys(topics).map(t=>{const p=Math.round(topics[t].r/topics[t].n*100);
  return '<p style="margin-top:6px">'+t+' — '+p+'%</p><div class="bar b"><i style="width:'+p+'%"></i></div>'}).join('')+'</div>';
 h+= weak.length?'<div class="card"><h2>⚠️ Weak topics (revision zaroori)</h2>'+weak.map(t=>'<span class="tag" style="color:var(--amb)">'+t+'</span>').join('')+'</div>':'<div class="card"><h2>💪 Koi weak topic nahi!</h2><p>Sab topics par achi grip hai. Shabash!</p></div>';
 app.innerHTML=h;hdr()}

/* ---------- PROFILE / CERTIFICATE ---------- */
function meView(){const doneN=Object.keys(S.done).length;
 let h='<div class="card"><h2>👤 Profile</h2><p style="margin-bottom:8px">Apna naam likhen (certificate ke liye):</p>'+
 '<input type="text" id="nm" placeholder="Aap ka naam" value="'+(S.name||'')+'" onchange="S.name=this.value;save()"></div>';
 h+='<div class="card"><h2>📜 Progress</h2><p>Lessons complete: <b style="color:var(--grn)">'+doneN+'/60</b></p><p>Tests diye: <b style="color:var(--txt)">'+Object.keys(S.tests).length+'</b></p><p>Longest streak: 🔥 '+S.best+' din</p></div>';
 const finalDone=S.done[59];
 if(finalDone){h+='<div class="cert"><h2>🏆 Certificate</h2><p style="margin:8px 0">Yeh certify kiya jata hai ke</p><div class="big" style="color:var(--txt)">'+(S.name||'Student')+'</div><p style="margin:8px 0">ne <b>English Master 60</b> course mukammal kiya — Wren & Martin Middle School Grammar ke tamam 60 din, lessons, quizzes aur tests ke sath.</p><p>Date: '+new Date().toLocaleDateString()+'</p></div>'}
 else{h+='<div class="card center"><h2>📜 Certificate</h2><p>Day 60 ka final assessment complete karein aur apna certificate hasil karein! ('+doneN+'/60)</p><div class="bar"><i style="width:'+doneN/60*100+'%"></i></div></div>'}
 h+='<div class="card"><button class="btn btn-gry" onclick="if(confirm(\'Poori progress delete ho jaye gi. Pakka?\')){localStorage.removeItem(\'wm60\');location.reload()}">🗑️ Reset progress</button></div>';
 app.innerHTML=h;hdr()}

hdr();go('home');
</script>
